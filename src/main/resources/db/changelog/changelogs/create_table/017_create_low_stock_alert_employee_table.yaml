databaseChangeLog:
  - changeSet:
      id: 017_create_low_stock_alert_employee_table.yaml
      author: petya_licheva
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: low_stock_alert_employees
      changes:
        - createTable:
            tableName: low_stock_alert_employees
            columns:
              - column:
                  name: low_stock_alert_id
                  type: UUID
              - column:
                  name: employees_id
                  type: UUID

        - addPrimaryKey:
            tableName: low_stock_alert_employees
            columnNames: low_stock_alert_id, employees_id

        - addForeignKeyConstraint:
            baseTableName: low_stock_alert_employees
            baseColumnNames: low_stock_alert_id
            referencedTableName: low_stock_alert
            referencedColumnNames: id
            constraintName: fk_alert_employee_alert

        - addForeignKeyConstraint:
            baseTableName: low_stock_alert_employees
            baseColumnNames: employees_id
            referencedTableName: employee
            referencedColumnNames: id
            constraintName: fk_alert_employee_employee
