databaseChangeLog:
  - changeSet:
      id: 018_create_stock_advice_table.yaml
      author: petya_licheva
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: stock_advice
      changes:
        - createTable:
            tableName: stock_advice
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
              - column:
                  name: valid_until
                  type: TIMESTAMP
              - column:
                  name: reasoning
                  type: VARCHAR(1000)
              - column:
                  name: is_actioned
                  type: BOOLEAN
              - column:
                  name: confidence
                  type: FLOAT(53)
              - column:
                  name: created_by_model_version
                  type: VARCHAR(100)
              - column:
                  name: updated_by_model_version
                  type: VARCHAR(100)
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
