databaseChangeLog:
  - changeSet:
      id: 003_create_item_type_table.yaml
      author: petya_licheva
      runAlways: true
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: item_type
      changes:
        # Create table
        - createTable:
            tableName: item_type
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(100)
              - column:
                  name: updated_by
                  type: VARCHAR(100)
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP

  - changeSet:
      id: 003_insert_item_types.yaml
      author: petya_licheva
      runAlways: true
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: item_type
      changes:
        # Insert rows
        - insert:
            tableName: item_type
            columns:
              - column: { name: id, value: "66666666-6666-6666-6666-666666666666" }
              - column: { name: name, value: "Beverages" }
              - column: { name: created_by, value: "system" }
              - column: { name: updated_by, value: "system" }
              - column: { name: created_at, value: "2025-12-28T00:00:00Z" }
              - column: { name: updated_at, value: "2025-12-28T00:00:00Z" }

        - insert:
