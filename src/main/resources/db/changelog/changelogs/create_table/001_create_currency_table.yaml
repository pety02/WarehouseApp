databaseChangeLog:
  - changeSet:
      id: 001_create_and_insert_currency_table.yaml
      author: petya_licheva
      runAlways: true
      preConditions:
        - not:
            tableExists:
              tableName: currency
            onFail: MARK_RAN
      changes:
        # Create the table
        - createTable:
            tableName: currency
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: abbreviation
                  type: VARCHAR(10)
                  constraints:
                    nullable: false

  - changeSet:
      id: 001_insert_currencies.yaml
      author: petya_licheva
      runAlways: true
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: currency
      changes:
        # Insert rows
        - insert:
            tableName: currency
            columns:
              - column: { name: "id", value: "11111111-1111-1111-1111-111111111111" }
              - column: { name: "name", value: "Bulgarian Lev" }
              - column: { name: "abbreviation", value: "BGN" }
        - insert:
            tableName: currency
            columns:
              - column: { name: "id", value: "22222222-2222-2222-2222-222222222222" }
              - column: { name: "name", value: "Euro" }
              - column: { name: "abbreviation", value: "EUR" }