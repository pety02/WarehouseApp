databaseChangeLog:
  - changeSet:
      id: 023_create_stock_advice_action_table.yaml
      author: petya_licheva
      preConditions:
        - not:
            tableExists:
              tableName: stock_advice_action
            onFail: MARK_RAN
      changes:
        - createTable:
            tableName: stock_advice_action
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: action_description
                  type: TEXT

              - column:
                  name: action_reason
                  type: TEXT

              - column:
                  name: is_actioned
                  type: BOOLEAN

              - column:
                  name: created_by
                  type: VARCHAR(100)

              - column:
                  name: updated_by
                  type: VARCHAR(100)

              - column:
                  name: created_at
                  type: TIMESTAMP

              - column:
                  name: updated_at
                  type: TIMESTAMP

              - column:
                  name: item_id
                  type: UUID
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: stock_advice_action
            baseColumnNames: item_id
            referencedTableName: item
            referencedColumnNames: id
            constraintName: fk_stock_advice_action_item
