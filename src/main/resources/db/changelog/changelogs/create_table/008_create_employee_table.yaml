databaseChangeLog:
  - changeSet:
      id: 008_create_employee_table.yaml
      author: petya_licheva
      preConditions:
        - not:
            tableExists:
              tableName: employee
            onFail: MARK_RAN
      changes:
        - createTable:
            tableName: employee
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(100)
              - column:
                  name: surname
                  type: VARCHAR(100)
              - column:
                  name: uid_no
                  type: VARCHAR(50)
              - column:
                  name: hire_date
                  type: DATE
              - column:
                  name: fire_date
                  type: DATE
              - column:
                  name: is_active
                  type: BOOLEAN
              - column:
                  name: credentials_id
                  type: UUID
              - column:
                  name: role_id
                  type: UUID
              - column:
                  name: location_id
                  type: UUID
              - column:
                  name: created_by
                  type: VARCHAR(100)
              - column:
                  name: updated_by
                  type: VARCHAR(100)
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP

        - addForeignKeyConstraint:
            baseTableName: employee
            baseColumnNames: credentials_id
            referencedTableName: employee_credentials
            referencedColumnNames: id
            constraintName: fk_employee_credentials

        - addForeignKeyConstraint:
            baseTableName: employee
            baseColumnNames: role_id
            referencedTableName: employee_role
            referencedColumnNames: id
            constraintName: fk_employee_role

        - addForeignKeyConstraint:
            baseTableName: employee
            baseColumnNames: location_id
            referencedTableName: location
            referencedColumnNames: id
            constraintName: fk_employee_location
