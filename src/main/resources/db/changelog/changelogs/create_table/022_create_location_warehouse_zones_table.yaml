databaseChangeLog:
  - changeSet:
      id: 022_create_location_warehouse_zones_table.yaml
      author: petya_licheva
      preConditions:
        - not:
            tableExists:
              tableName: location_warehouse_zones
            onFail: MARK_RAN
      changes:
        - createTable:
            tableName: location_warehouse_zones
            columns:
              - column:
                  name: location_id
                  type: UUID
                  constraints:
                    primaryKey: true
              - column:
                  name: warehouse_zones_id
                  type: UUID
                  constraints:
                    primaryKey: true
        - addForeignKeyConstraint:
            baseTableName: location_warehouse_zones
            baseColumnNames: location_id
            referencedTableName: location
            referencedColumnNames: id
            constraintName: fk_location_warehouse
        - addForeignKeyConstraint:
            baseTableName: location_warehouse_zones
            baseColumnNames: warehouse_zones_id
            referencedTableName: warehouse_zone
            referencedColumnNames: id
            constraintName: fk_warehouse_location