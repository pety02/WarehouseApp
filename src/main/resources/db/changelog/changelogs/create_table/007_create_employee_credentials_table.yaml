databaseChangeLog:
  - changeSet:
      id: 007_create_employee_credentials_table.yaml
      author: petya_licheva
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: employee_credentials
      changes:
        - createTable:
            tableName: employee_credentials
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
              - column:
                  name: email
                  type: VARCHAR(150)
              - column:
                  name: phone_number
                  type: VARCHAR(50)
              - column:
                  name: password
                  type: VARCHAR(255)
              - column:
                  name: created_by
                  type: VARCHAR(100)
              - column:
                  name: updated_by
                  type: VARCHAR(100)
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
