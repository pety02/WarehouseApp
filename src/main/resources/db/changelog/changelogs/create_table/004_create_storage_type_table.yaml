databaseChangeLog:
  - changeSet:
      id: 004_create_storage_type_table.yaml
      author: petya_licheva
      runAlways: true
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: storage_type
      changes:
        - createTable:
            tableName: storage_type
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(100)
              - column:
                  name: updated_by
                  type: VARCHAR(100)
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP

  - changeSet:
      id: 004_insert_storage_types.yaml
      author: petya_licheva
      runAlways: true
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: storage_type
      changes:
        - insert:
            tableName: storage_type
            columns:
              - column: {name: id, value: "22222222-aaaa-bbbb-cccc-333333333333"}
              - column: {name: name, value: "Refrigerated"}
              - column: {name: created_by, value: "system"}
              - column: {name: updated_by, value: "system"}
              - column: {name: created_at, value: "2025-12-28T00:00:00Z"}
              - column: {name: updated_at, value: "2025-12-28T00:00:00Z"}

